<body style="margin:0;background:#050505;">
  <div id="client2-startup-fallback" role="status" aria-live="polite"
       style="position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center;direction:rtl;">
    <div style="font-size:25px;font-weight:700;">التخفيض الصح</div>
    <div id="client2-startup-message" style="font-size:15px;line-height:1.8;">جارٍ تشغيل المتجر…</div>
    <div id="client2-startup-detail" style="display:none;max-width:520px;color:#ffcdd2;font-size:13px;line-height:1.7;"></div>
    <button id="client2-startup-reload" type="button"
      style="display:none;border:0;border-radius:8px;padding:12px 20px;background:#fff;color:#111;font-size:15px;font-weight:700;"
      onclick="window.location.reload()">إعادة المحاولة</button>
  </div>
  <script>
    (function () {
      var fallback = document.getElementById('client2-startup-fallback');
      var message = document.getElementById('client2-startup-message');
      var detail = document.getElementById('client2-startup-detail');
      var reload = document.getElementById('client2-startup-reload');
      var firstFrameReceived = false;
      function hideFallback() {
        firstFrameReceived = true;
        if (fallback) fallback.style.display = 'none';
      }
      function showFailure(text) {
        // Keep a visible recovery screen if Flutter fails before its first frame
        // or a JavaScript exception occurs after the page has started.
        if (fallback) fallback.style.display = 'flex';
        message.textContent = 'تعذر تشغيل واجهة المتجر.';
        detail.textContent = text || 'تحقق من اتصال الإنترنت ثم أعد المحاولة.';
        detail.style.display = 'block';
        reload.style.display = 'inline-block';
      }
      window.addEventListener('flutter-first-frame', function () {
        hideFallback();
      });
      window.addEventListener('error', function (event) {
        if (event && event.target && event.target.tagName === 'SCRIPT') {
          showFailure('تعذر تحميل ملف التطبيق: ' + (event.target.src || 'JavaScript'));
          return;
        }
        if (event && (event.message || event.error)) {
          showFailure('خطأ JavaScript: ' + (event.message || String(event.error)));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event && event.reason;
        showFailure('فشل تشغيل التطبيق: ' + (reason && reason.message ? reason.message : String(reason || 'خطأ غير معروف')));
      });
      window.setTimeout(function () {
        if (!firstFrameReceived) {
          showFailure('لم تظهر أول شاشة خلال 20 ثانية. قد يكون السبب خطأ JavaScript أو تعذر الاتصال بالخادم.');
        }
      }, 20000);
      // Remove old service workers/caches left by previous releases; they can
      // otherwise keep serving stale Flutter assets after a deployment.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) { registration.unregister(); });
        }).catch(function () {});
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        }).catch(function () {});
      }
    })();
  </script>
  <script id="client2-flutter-main" src="main.dart.js" type="application/javascript"
          onerror="(function(){var f=document.getElementById('client2-startup-fallback');var m=document.getElementById('client2-startup-message');var d=document.getElementById('client2-startup-detail');var r=document.getElementById('client2-startup-reload');if(f)f.style.display='flex';if(m)m.textContent='تعذر تشغيل واجهة المتجر.';if(d){d.textContent='تعذر تحميل ملف Flutter main.dart.js.';d.style.display='block';}if(r)r.style.display='inline-block';})()"></script>
</body>
</html>
