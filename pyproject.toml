[project]
name = "altakhfidalsh"
version = "0.2.0"
description = "Mobile-first Arabic e-commerce administration platform"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Cors>=6,<7",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-Migrate>=4,<5",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1,<2",
  "gunicorn>=23,<24",
  "Pillow>=11,<12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
