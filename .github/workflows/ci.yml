name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: altakhfidalsh
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d altakhfidalsh"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/altakhfidalsh
      SECRET_KEY: ci-test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m compileall app tests

      - name: Apply checked-in migration
        run: flask --app wsgi.py db upgrade

      - name: Verify migration state
        run: flask --app wsgi.py db current

      - name: Test
        run: pytest
