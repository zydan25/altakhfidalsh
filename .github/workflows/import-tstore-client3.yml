name: Import TStore into client3

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-tstore-client3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-tstore-client3-main
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream TStore
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/mahmoodhamdi/TStore.git "$RUNNER_TEMP/TStore"
          test -f "$RUNNER_TEMP/TStore/pubspec.yaml"
          test -d "$RUNNER_TEMP/TStore/lib"
          echo "UPSTREAM_SHA=$(git -C "$RUNNER_TEMP/TStore" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Copy source into client3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p client3
          rsync -a \
            --exclude='.git/' \
            --exclude='.claude/' \
            --exclude='.vscode/' \
            --exclude='.dart_tool/' \
            --exclude='build/' \
            --exclude='local.properties' \
            --exclude='.env' \
            --exclude='*.jks' \
            --exclude='*.keystore' \
            --exclude='key.properties' \
            "$RUNNER_TEMP/TStore/" client3/

          find client3 -type f \( \
            -name '.env' -o \
            -name 'local.properties' -o \
            -name 'google-services.json' -o \
            -name 'GoogleService-Info.plist' -o \
            -name '*.jks' -o \
            -name '*.keystore' -o \
            -name 'key.properties' \
          \) -delete

          cat > client3/UPSTREAM_IMPORT_AR.md <<EOF
          # معلومات مصدر client3

          - المصدر: https://github.com/mahmoodhamdi/TStore
          - الفرع المستورد: main
          - commit المصدر: ${UPSTREAM_SHA}
          - تمت المحافظة على README الأصلي ونسخ التطبيق داخل هذا المجلد.
          - استُبعدت ملفات إعداد المطور المحلية ومجلدات البناء وملفات البيئة والأسرار المحتملة.

          ## ملاحظة الترخيص
          README المصدر يعلن MIT ويحيل إلى ملف LICENSE، لكن ملف LICENSE لم يظهر في الشجرة التي فُحصت. يجب التحقق من الترخيص الفعلي/استعادة نصه من صاحب المشروع قبل النشر العام أو التوزيع التجاري. لا نفترض أن شارة MIT وحدها تعوض ملف الترخيص المفقود.

          ## الحالة
          هذه نسخة أساس لواجهة TStore. لم يكتمل ربطها بخادم Flask ولم يتم اعتماد الدفع أو المصادقة أو الطلبات للإنتاج.
          راجع PLAN_AR.md وAPI_MAPPING_AR.md.
          EOF

      - name: Commit and push to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client3
          if git diff --cached --quiet; then
            echo "No import changes to commit."
            exit 0
          fi
          git commit -m "Import TStore Flutter app into client3"
          git push origin HEAD:main
