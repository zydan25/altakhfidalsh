name: Customer Flutter CI

on:
  push:
    branches:
      - main
      - fix/customer-notifications-launch-icon-2026-10
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        working-directory: client
        run: flutter create --platforms=android .

      - name: Prepare Android startup splash
        working-directory: client
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values-v31
          python - <<'PY'
          from pathlib import Path
          import re

          transparent = Path("android/app/src/main/res/drawable/transparent_splash.xml")
          transparent.write_text("""<?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="rectangle">
              <solid android:color="@android:color/transparent" />
          </shape>
          """, encoding="utf-8")

          for path in (
              Path("android/app/src/main/res/values/styles.xml"),
              Path("android/app/src/main/res/values-v31/styles.xml"),
          ):
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")

              # Android 12 always shows a system splash. Use a transparent
              # splash icon so the system launch frame does not show the
              # storefront launcher artwork before the Flutter welcome screen.
              if "windowSplashScreenAnimatedIcon" not in text:
                  text = text.replace(
                      "</style>",
                      '    <item name="android:windowSplashScreenAnimatedIcon">@drawable/transparent_splash</item>\n</style>',
                      1,
                  )

              if path.name == "styles.xml" and "android:windowBackground" in text:
                  text = re.sub(
                      r'(<style[^>]*name="LaunchTheme"[^>]*>.*?<item[^>]*name="android:windowBackground">)@drawable/launch_background(</item>)',
                      r'\1@android:color/black\2',
                      text,
                      count=1,
                      flags=re.S,
                  )
              path.write_text(text, encoding="utf-8")
          PY

      - name: Prepare branding assets
        run: |
          mkdir -p client/assets client/android/app/src/main/res/drawable
          cp 20260911_164630.jpg client/assets/app_background.jpg

          # Build a high-resolution, full-bleed circular launcher icon from
          # the supplied branding image. The crop fills the icon instead of
          # leaving a white/empty frame around a small image.
          sudo apt-get update
          sudo apt-get install -y imagemagick

          # The source artwork is a portrait canvas with a large black margin.
          # Trim that margin by color similarity first, then build a square icon
          # so the logo itself occupies the launcher mask instead of appearing tiny.
          convert 20260911_164630.jpg \
            -auto-orient \
            -colorspace sRGB \
            -fuzz 10% -trim +repage \
            -resize '470x470^' \
            -gravity center \
            -background '#050505' \
            -extent 470x470 \
            -bordercolor '#050505' -border 21 \
            -unsharp 0x0.8+0.8+0 \
            -strip \
            client/android/app/src/main/res/drawable/app_icon.png

          # Android status-bar/notification icons should be a simple
          # monochrome foreground with transparency, not the full-color logo.
          convert 20260911_164630.jpg \
            -auto-orient \
            -colorspace sRGB \
            -fuzz 10% -trim +repage \
            -resize '180x180^' \
            -gravity center \
            -background none \
            -extent 180x180 \
            -transparent '#000000' \
            -fill white -colorize 100 \
            -strip \
            client/android/app/src/main/res/drawable/notification_icon.png

      - name: Set Android launcher icon
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          text2 = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/app_icon"',
              text,
              count=1,
          )
          text3 = re.sub(
              r'android:roundIcon="@[^"]+"',
              'android:roundIcon="@drawable/app_icon"',
              text2,
              count=1,
          )
          if text3 == text:
              raise SystemExit("AndroidManifest.xml: launcher icon references not found")
          path.write_text(text3, encoding="utf-8")
          print("Android icon and roundIcon both use the full-bleed branded icon.")
          PY

      - name: Configure referral deep links
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          filters = '''
              <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data
                      android:scheme="https"
                      android:host="takhfidsh.alattab.site"
                      android:pathPrefix="/" />
              </intent-filter>
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="altakhfid" android:host="invite" />
              </intent-filter>
          '''

          pattern = re.compile(
              r'(<activity[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)',
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("MainActivity activity not found")

          activity_body = match.group(2)
          if "takhfidsh.alattab.site" not in activity_body:
              activity_body += "\n" + filters + "\n"
          activity_opening = match.group(1)
          if 'android:launchMode=' not in activity_opening:
              activity_opening = activity_opening[:-1] + ' android:launchMode="singleTop">'
          text = (
              text[:match.start(1)]
              + activity_opening
              + text[match.end(1):match.start(2)]
              + activity_body
              + text[match.end(2):]
          )
          path.write_text(text, encoding="utf-8")
          print("Configured HTTPS and altakhfid://invite referral links.")
          PY

      - name: Enable Android Internet access
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in text:
              marker = '<application'
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml: <application> not found")
              text = text.replace(marker, permission + "\n    " + marker, 1)
              path.write_text(text, encoding="utf-8")

          print("Verified Android INTERNET permission:")
          for line in path.read_text(encoding="utf-8").splitlines():
              if "android.permission.INTERNET" in line:
                  print(line)
          PY

      - name: Configure Firebase and notification channel
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # The Firebase Android app was registered as:
          # com.example.altakhfid_client
          # The generated google-services.json is committed with the customer app.
          google_services = Path("android/app/google-services.json")
          if not google_services.exists():
              raise SystemExit("Missing android/app/google-services.json")

          settings_kts = Path("android/settings.gradle.kts")
          settings_groovy = Path("android/settings.gradle")
          if settings_kts.exists():
              path = settings_kts
              text = path.read_text(encoding="utf-8")
              plugin = '    id("com.google.gms.google-services") version "4.5.0" apply false'
              if "com.google.gms.google-services" not in text:
                  marker = "plugins {"
                  if marker not in text:
                      raise SystemExit("settings.gradle.kts: plugins block not found")
                  text = text.replace(marker, marker + "\n" + plugin, 1)
          elif settings_groovy.exists():
              path = settings_groovy
              text = path.read_text(encoding="utf-8")
              plugin = '    id "com.google.gms.google-services" version "4.5.0" apply false'
              if "com.google.gms.google-services" not in text:
                  marker = "plugins {"
                  if marker not in text:
                      raise SystemExit("settings.gradle: plugins block not found")
                  text = text.replace(marker, marker + "\n" + plugin, 1)
          else:
              raise SystemExit("Android settings.gradle file not found")
          path.write_text(text, encoding="utf-8")

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          if kotlin.exists():
              path = kotlin
              text = path.read_text(encoding="utf-8")
              plugin = '    id("com.google.gms.google-services")'
              if "com.google.gms.google-services" not in text:
                  marker = "plugins {"
                  if marker not in text:
                      raise SystemExit("build.gradle.kts: plugins block not found")
                  text = text.replace(marker, marker + "\n" + plugin, 1)
          elif groovy.exists():
              path = groovy
              text = path.read_text(encoding="utf-8")
              plugin = "    id 'com.google.gms.google-services'"
              if "com.google.gms.google-services" not in text:
                  marker = "plugins {"
                  if marker not in text:
                      raise SystemExit("build.gradle: plugins block not found")
                  text = text.replace(marker, marker + "\n" + plugin, 1)
          else:
              raise SystemExit("Android app Gradle file not found")
          path.write_text(text, encoding="utf-8")

          # Configure the channel FCM uses when Android displays a background
          # notification. Importance HIGH/MAX is created in Dart as well.
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if "com.google.firebase.messaging.default_notification_channel_id" not in text:
              metadata = '''
              <meta-data
                  android:name="com.google.firebase.messaging.default_notification_channel_id"
                  android:value="altakhfid_alerts_v5" />'''
              pattern = re.compile(r"(    <application\b[^>]*>)")
              text2, count = pattern.subn(
                  lambda match: match.group(1) + metadata,
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("AndroidManifest.xml: <application> opening tag not found")
              text = text2
          manifest.write_text(text, encoding="utf-8")
          print("Firebase Google Services plugin and FCM default channel configured.")
          PY

          grep -n -E "google-services|default_notification_channel_id|altakhfid_alerts_v5"             android/settings.gradle android/settings.gradle.kts             android/app/build.gradle android/app/build.gradle.kts             android/app/src/main/AndroidManifest.xml 2>/dev/null || true

      - name: Set Android application name
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          import re

          updated = re.sub(
              r'(android:label=")[^"]*(")',
              r'\1التخفيض الصح\2',
              text,
              count=1,
          )
          if updated == text:
              raise SystemExit("AndroidManifest.xml: android:label not found")
          path.write_text(updated, encoding="utf-8")
          print("Android application label set to: التخفيض الصح")
          PY

      - name: Enable Android core library desugaring
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if kotlin.exists():
              path = kotlin
              text = path.read_text(encoding="utf-8")

              compile_marker = "compileOptions {"
              if compile_marker not in text:
                  raise SystemExit("build.gradle.kts: compileOptions block not found")
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = text.replace(
                      compile_marker,
                      compile_marker + "\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )

              if "coreLibraryDesugaring(" not in text:
                  dep_marker = "dependencies {"
                  if dep_marker not in text:
                      text += (
                          "\n\ndependencies {\n"
                          '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                          "}\n"
                      )
                  else:
                      text = text.replace(
                          dep_marker,
                          dep_marker
                          + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                          1,
                      )
          elif groovy.exists():
              path = groovy
              text = path.read_text(encoding="utf-8")

              compile_marker = "compileOptions {"
              if compile_marker not in text:
                  raise SystemExit("build.gradle: compileOptions block not found")
              if "coreLibraryDesugaringEnabled" not in text:
                  text = text.replace(
                      compile_marker,
                      compile_marker + "\n        coreLibraryDesugaringEnabled true",
                      1,
                  )

              if "coreLibraryDesugaring '" not in text and 'coreLibraryDesugaring "' not in text:
                  dep_marker = "dependencies {"
                  if dep_marker not in text:
                      text += (
                          "\n\ndependencies {\n"
                          "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                          "}\n"
                      )
                  else:
                      text = text.replace(
                          dep_marker,
                          dep_marker
                          + "\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                          1,
                      )
          else:
              raise SystemExit("Android app Gradle file not found")

          path.write_text(text, encoding="utf-8")
          print(f"Enabled core library desugaring in {path}")
          PY

          grep -n -E "CoreLibraryDesugaring|coreLibraryDesugaring|desugar_jdk_libs"             android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: client
        run: flutter test

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release --dart-define=API_BASE_URL=https://takhfidsh.alattab.site/api/v1

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: altakhfid-android-release-${{ github.sha }}
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
