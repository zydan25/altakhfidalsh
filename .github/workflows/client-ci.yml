name: Customer Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        working-directory: client
        run: flutter create --platforms=android .

      - name: Dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: client
        run: flutter test

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release --dart-define=API_BASE_URL=https://takhfidsh.alattab.site/api/v1
