name: Customer Flutter CI

on:
  push:
    branches:
      - main
      - fix/customer-notifications-launch-icon-2026-10
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        working-directory: client
        run: flutter create --platforms=android .

      - name: Prepare branding assets
        run: |
          mkdir -p client/assets client/android/app/src/main/res/drawable
          cp 20260911_164630.jpg client/assets/app_background.jpg

          # Build a high-resolution, full-bleed circular launcher icon from
          # the supplied branding image. The crop fills the icon instead of
          # leaving a white/empty frame around a small image.
          sudo apt-get update
          sudo apt-get install -y imagemagick

          # The source artwork is a portrait canvas with a large black margin.
          # Trim that margin by color similarity first, then build a square icon
          # so the logo itself occupies the launcher mask instead of appearing tiny.
          convert 20260911_164630.jpg \
            -auto-orient \
            -colorspace sRGB \
            -fuzz 10% -trim +repage \
            -resize '470x470^' \
            -gravity center \
            -background '#050505' \
            -extent 470x470 \
            -bordercolor '#050505' -border 21 \
            -unsharp 0x0.8+0.8+0 \
            -strip \
            client/android/app/src/main/res/drawable/app_icon.png

          # Android status-bar/notification icons should be a simple
          # monochrome foreground with transparency, not the full-color logo.
          convert 20260911_164630.jpg \
            -auto-orient \
            -colorspace sRGB \
            -fuzz 10% -trim +repage \
            -resize '180x180^' \
            -gravity center \
            -background none \
            -extent 180x180 \
            -transparent '#000000' \
            -fill white -colorize 100 \
            -strip \
            client/android/app/src/main/res/drawable/notification_icon.png

      - name: Set Android launcher icon
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          text2 = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/app_icon"',
              text,
              count=1,
          )
          text3 = re.sub(
              r'android:roundIcon="@[^"]+"',
              'android:roundIcon="@drawable/app_icon"',
              text2,
              count=1,
          )
          if text3 == text:
              raise SystemExit("AndroidManifest.xml: launcher icon references not found")
          path.write_text(text3, encoding="utf-8")
          print("Android icon and roundIcon both use the full-bleed branded icon.")
          PY

      - name: Configure referral deep links
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          filters = '''
              <intent-filter android:autoVerify="true">
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data
                      android:scheme="https"
                      android:host="takhfidsh.alattab.site"
                      android:pathPrefix="/" />
              </intent-filter>
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="altakhfid" android:host="invite" />
              </intent-filter>
          '''

          pattern = re.compile(
              r'(<activity[^>]*android:name="[^"]*MainActivity"[^>]*>)(.*?)(</activity>)',
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit("MainActivity activity not found")

          activity_body = match.group(2)
          if "takhfidsh.alattab.site" not in activity_body:
              activity_body += "\n" + filters + "\n"
          text = text[:match.start(2)] + activity_body + text[match.end(2):]
          path.write_text(text, encoding="utf-8")
          print("Configured HTTPS and altakhfid://invite referral links.")
          PY

      - name: Enable Android Internet access
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in text:
              marker = '<application'
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml: <application> not found")
              text = text.replace(marker, permission + "\n    " + marker, 1)
              path.write_text(text, encoding="utf-8")

          print("Verified Android INTERNET permission:")
          for line in path.read_text(encoding="utf-8").splitlines():
              if "android.permission.INTERNET" in line:
                  print(line)
          PY

      - name: Configure notification service permissions
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          manifest_permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]

          marker = '<application'
          if marker not in text:
              raise SystemExit("AndroidManifest.xml: <application> not found")

          for permission in manifest_permissions:
              if permission not in text:
                  text = text.replace(marker, permission + "\n    " + marker, 1)

          # The Android plugin declares the same service as exported=true.
          # Explicitly replace that attribute in the app manifest so the merge
          # is deterministic and compatible with the background-service plugin.
          if 'xmlns:tools="http://schemas.android.com/tools"' not in text:
              text = text.replace(
                  '<manifest xmlns:android=',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" xmlns:android=',
                  1,
              )

          service = '''    <service
              android:name="id.flutter.flutter_background_service.BackgroundService"
              android:exported="false"
              android:foregroundServiceType="remoteMessaging"
              tools:replace="android:exported" />'''
          if "id.flutter.flutter_background_service.BackgroundService" not in text:
              text = text.replace(
                  "    </application>",
                  service + "\n    </application>",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          print("Configured custom WebSocket notification foreground service.")
          PY

          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable/app_icon.png android/app/src/main/res/drawable/ic_bg_service_small.png

      - name: Set Android application name
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          import re

          updated = re.sub(
              r'(android:label=")[^"]*(")',
              r'\1التخفيض الصح\2',
              text,
              count=1,
          )
          if updated == text:
              raise SystemExit("AndroidManifest.xml: android:label not found")
          path.write_text(updated, encoding="utf-8")
          print("Android application label set to: التخفيض الصح")
          PY

      - name: Enable Android core library desugaring
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if kotlin.exists():
              path = kotlin
              text = path.read_text(encoding="utf-8")

              compile_marker = "compileOptions {"
              if compile_marker not in text:
                  raise SystemExit("build.gradle.kts: compileOptions block not found")
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = text.replace(
                      compile_marker,
                      compile_marker + "\n        isCoreLibraryDesugaringEnabled = true",
                      1,
                  )

              if "coreLibraryDesugaring(" not in text:
                  dep_marker = "dependencies {"
                  if dep_marker not in text:
                      text += (
                          "\n\ndependencies {\n"
                          '    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n'
                          "}\n"
                      )
                  else:
                      text = text.replace(
                          dep_marker,
                          dep_marker
                          + '\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                          1,
                      )
          elif groovy.exists():
              path = groovy
              text = path.read_text(encoding="utf-8")

              compile_marker = "compileOptions {"
              if compile_marker not in text:
                  raise SystemExit("build.gradle: compileOptions block not found")
              if "coreLibraryDesugaringEnabled" not in text:
                  text = text.replace(
                      compile_marker,
                      compile_marker + "\n        coreLibraryDesugaringEnabled true",
                      1,
                  )

              if "coreLibraryDesugaring '" not in text and 'coreLibraryDesugaring "' not in text:
                  dep_marker = "dependencies {"
                  if dep_marker not in text:
                      text += (
                          "\n\ndependencies {\n"
                          "    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n"
                          "}\n"
                      )
                  else:
                      text = text.replace(
                          dep_marker,
                          dep_marker
                          + "\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'",
                          1,
                      )
          else:
              raise SystemExit("Android app Gradle file not found")

          path.write_text(text, encoding="utf-8")
          print(f"Enabled core library desugaring in {path}")
          PY

          grep -n -E "CoreLibraryDesugaring|coreLibraryDesugaring|desugar_jdk_libs"             android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

      - name: Dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: client
        run: flutter test

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release --dart-define=API_BASE_URL=https://takhfidsh.alattab.site/api/v1

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: altakhfid-android-release-${{ github.sha }}
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
