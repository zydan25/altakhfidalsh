name: Customer Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        working-directory: client
        run: flutter create --platforms=android .

      - name: Prepare branding assets
        run: |
          mkdir -p client/assets client/android/app/src/main/res/drawable
          cp 20260911_164630.jpg client/assets/app_background.jpg

          # Build a high-resolution, full-bleed circular launcher icon from
          # the supplied branding image. The crop fills the icon instead of
          # leaving a white/empty frame around a small image.
          sudo apt-get update
          sudo apt-get install -y imagemagick

          convert 20260911_164630.jpg \
            -auto-orient \
            -trim +repage \
            -resize '512x512^' \
            -gravity center \
            -extent 512x512 \
            -unsharp 0x0.8+0.8+0 \
            -strip \
            client/android/app/src/main/res/drawable/app_icon_base.png

          convert client/android/app/src/main/res/drawable/app_icon_base.png \
            -alpha on \
            \( -size 512x512 xc:none \
               -fill white -draw 'circle 256,256 256,0' \) \
            -compose CopyOpacity -composite \
            -strip \
            client/android/app/src/main/res/drawable/app_icon.png

          rm -f client/android/app/src/main/res/drawable/app_icon_base.png

      - name: Set Android launcher icon
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          text2 = re.sub(
              r'android:icon="@[^"]+"',
              'android:icon="@drawable/app_icon"',
              text,
              count=1,
          )
          text3 = re.sub(
              r'android:roundIcon="@[^"]+"',
              'android:roundIcon="@drawable/app_icon"',
              text2,
              count=1,
          )
          if text3 == text:
              raise SystemExit("AndroidManifest.xml: launcher icon references not found")
          path.write_text(text3, encoding="utf-8")
          print("Android icon and roundIcon both use the full-bleed branded icon.")
          PY

      - name: Enable Android Internet access
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          permission = '<uses-permission android:name="android.permission.INTERNET" />'

          if permission not in text:
              marker = '<application'
              if marker not in text:
                  raise SystemExit("AndroidManifest.xml: <application> not found")
              text = text.replace(marker, permission + "\n    " + marker, 1)
              path.write_text(text, encoding="utf-8")

          print("Verified Android INTERNET permission:")
          for line in path.read_text(encoding="utf-8").splitlines():
              if "android.permission.INTERNET" in line:
                  print(line)
          PY

      - name: Configure notification service permissions
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          manifest_permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.VIBRATE" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
          ]

          marker = '<application'
          if marker not in text:
              raise SystemExit("AndroidManifest.xml: <application> not found")

          for permission in manifest_permissions:
              if permission not in text:
                  text = text.replace(marker, permission + "\n    " + marker, 1)

          service = '''    <service
              android:name="id.flutter.flutter_background_service.BackgroundService"
              android:exported="false"
              android:foregroundServiceType="remoteMessaging" />'''
          if "id.flutter.flutter_background_service.BackgroundService" not in text:
              text = text.replace(
                  "    </application>",
                  service + "\n    </application>",
                  1,
              )

          path.write_text(text, encoding="utf-8")
          print("Configured custom WebSocket notification foreground service.")
          PY

          mkdir -p android/app/src/main/res/drawable
          cp android/app/src/main/res/drawable/app_icon.png android/app/src/main/res/drawable/ic_bg_service_small.png

      - name: Set Android application name
        working-directory: client
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          import re

          updated = re.sub(
              r'(android:label=")[^"]*(")',
              r'\1التخفيض الصح\2',
              text,
              count=1,
          )
          if updated == text:
              raise SystemExit("AndroidManifest.xml: android:label not found")
          path.write_text(updated, encoding="utf-8")
          print("Android application label set to: التخفيض الصح")
          PY

      - name: Dependencies
        working-directory: client
        run: flutter pub get

      - name: Analyze
        working-directory: client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        working-directory: client
        run: flutter test

      - name: Build release APK
        working-directory: client
        run: flutter build apk --release --dart-define=API_BASE_URL=https://takhfidsh.alattab.site/api/v1

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: altakhfid-android-release-${{ github.sha }}
          path: client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
