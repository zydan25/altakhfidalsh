name: Move client2 Flutter project to root

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/move-client2-root.yml"

permissions:
  contents: write

jobs:
  move-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Move extracted Flutter project into client2 root
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="client2/Flutter-Multivendor-Mobile-app-for-WooCommerce-Khurshidbek_18"
          test -d "$SOURCE"
          test -f "$SOURCE/pubspec.yaml"
          test -f "$SOURCE/lib/main.dart"

          # Copy the source project into client2 itself, merging directories
          # while preserving the independent Flask adapter and Arabic docs.
          rsync -a --exclude='/local.properties' "$SOURCE/" client2/

          # local.properties contains machine-specific SDK paths and must not
          # be copied into the repository root.
          rm -f client2/local.properties

          # Remove the redundant nested extracted project; keep the original ZIP.
          rm -rf "$SOURCE"

          # This one-shot helper must not remain in the repository.
          rm -f .github/workflows/move-client2-root.yml

          git add -A client2 .github/workflows/move-client2-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No file changes detected."
          else
            git commit -m "refactor(client2): move Flutter source to project root"
            git push origin HEAD:main
          fi
