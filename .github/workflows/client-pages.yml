name: Customer Web - GitHub Pages (client3)

on:
  push:
    branches: [main]
    paths:
      - "client3/**"
      - "20260911_164630.jpg"
      - "docs/CUSTOMER_SHEIN_PARITY.md"
      - ".github/workflows/client-pages.yml"
      - ".github/workflows/client3-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter for client3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: stable
          cache: true
          pub-cache: true

      - name: Prepare runtime placeholder and store branding
        run: |
          mkdir -p client3/web/icons client3/assets
          # flutter_dotenv requires this declared asset at compile time.
          # Keep this generated file empty; no environment values are committed.
          printf '# Generated by GitHub Actions; no secrets here.\n' > client3/.env
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert 20260911_164630.jpg -auto-orient -colorspace sRGB -fuzz 10% -trim +repage -resize '470x470^' -gravity center -background '#050505' -extent 470x470 -bordercolor '#050505' -border 21 -unsharp 0x0.8+0.8+0 -strip client3/web/icons/Icon-512.png
          convert client3/web/icons/Icon-512.png -resize 192x192 -strip client3/web/icons/Icon-192.png
          cp client3/web/icons/Icon-512.png client3/web/icons/Icon-maskable-512.png
          convert client3/web/icons/Icon-512.png -resize 192x192 -strip client3/web/icons/Icon-maskable-192.png
          convert client3/web/icons/Icon-512.png -resize 64x64 -strip client3/web/favicon.png

      - name: Resolve client3 dependencies
        working-directory: client3
        run: flutter pub get

      - name: Run client3 tests
        working-directory: client3
        run: flutter test

      - name: Analyze client3 Dart code
        working-directory: client3
        run: flutter analyze

      - name: Configure root/custom-domain and GitHub Pages base path
        working-directory: client3
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("web/index.html")
          html = path.read_text(encoding="utf-8")
          html = re.sub(r"<base\\b[^>]*>", "", html, count=1, flags=re.IGNORECASE)
          bootstrap = """  <script data-client3-base>
            (function () {
              var host = window.location.hostname.toLowerCase();
              var baseHref = host === "zydan25.github.io" ? "/altakhfidalsh/" : "/";
              document.write('<base href="' + baseHref + '">');
            })();
          </script>"""
          if "data-client3-base" not in html:
              html = html.replace("<head>", "<head>\\n" + bootstrap, 1)
          path.write_text(html, encoding="utf-8")
          PY

      - name: Build client3 Flutter web
        working-directory: client3
        env:
          API_BASE_URL: https://takhfidsh.alattab.site/api/v1
        run: |
          flutter build web --release -t lib/main_development.dart --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prepare Pages metadata and cache busting
        working-directory: client3
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          root = Path("build/web")
          sha = os.environ["BUILD_SHA"]
          index = root / "index.html"
          html = index.read_text(encoding="utf-8")
          html = html.replace("flutter_bootstrap.js", "flutter_bootstrap.js?v=" + sha)
          html = html.replace("main.dart.js", "main.dart.js?v=" + sha)
          guard = "\\n".join([
              '<meta name="altakhfid-build" content="' + sha + '">',
              '<meta name="theme-color" content="#050505">',
              '<meta name="application-name" content="التخفيض الصح">',
              '<meta name="apple-mobile-web-app-title" content="التخفيض الصح">',
              '<link rel="icon" type="image/png" href="favicon.png">',
              '<link rel="apple-touch-icon" href="icons/Icon-192.png">',
          ])
          html = html.replace("</head>", guard + "\\n</head>")
          index.write_text(html, encoding="utf-8")

          manifest = root / "manifest.json"
          data = json.loads(manifest.read_text(encoding="utf-8"))
          data.update({
              "name": "التخفيض الصح",
              "short_name": "التخفيض الصح",
              "description": "متجر التخفيض الصح",
              "display": "standalone",
              "start_url": "./",
              "scope": "./",
              "theme_color": "#050505",
              "background_color": "#050505",
          })
          data["icons"] = [
              {"src": "icons/Icon-192.png", "sizes": "192x192", "type": "image/png"},
              {"src": "icons/Icon-512.png", "sizes": "512x512", "type": "image/png"},
              {"src": "icons/Icon-maskable-192.png", "sizes": "192x192", "type": "image/png", "purpose": "maskable"},
              {"src": "icons/Icon-maskable-512.png", "sizes": "512x512", "type": "image/png", "purpose": "maskable"},
          ]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          (root / "404.html").write_text(index.read_text(encoding="utf-8"), encoding="utf-8")
          (root / "CNAME").write_text("takhfidsh.alattab.site\\n", encoding="utf-8")
          PY

      - name: Verify client3 Pages output
        working-directory: client3
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/flutter_bootstrap.js
          test -s build/web/manifest.json
          test -s build/web/CNAME
          grep -q 'التخفيض الصح' build/web/index.html
          grep -q 'data-client3-base' build/web/index.html
          grep -q 'takhfidsh.alattab.site' build/web/CNAME

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: altakhfid-client3-web-${{ github.sha }}
          path: client3/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client3/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy client3 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
