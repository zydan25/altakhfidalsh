name: Customer Web - GitHub Pages (client2)

on:
  push:
    branches: [main]
    paths:
      - 'client2/**'
      - 'docs/CUSTOMER_SHEIN_PARITY.md'
      - '.github/workflows/client-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for legacy Flutter tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Flutter matching client2
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "1.22.6"
          channel: stable
          cache: true

      - name: Prepare branding assets
        run: |
          mkdir -p client2/assets client2/web/icons
          cp 20260911_164630.jpg client2/assets/app_background.jpg

          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert 20260911_164630.jpg -auto-orient -colorspace sRGB -fuzz 10% -trim +repage -resize '470x470^' -gravity center -background '#050505' -extent 470x470 -bordercolor '#050505' -border 21 -unsharp 0x0.8+0.8+0 -strip client2/web/icons/Icon-512.png
          convert client2/web/icons/Icon-512.png -resize 192x192 -strip client2/web/icons/Icon-192.png
          cp client2/web/icons/Icon-512.png client2/web/icons/Icon-maskable-512.png
          convert client2/web/icons/Icon-512.png -resize 64x64 -strip client2/web/favicon.png

      - name: Dependencies
        working-directory: client2
        run: flutter pub get

      - name: Build Flutter web
        working-directory: client2
        env:
          API_BASE_URL: https://takhfidsh.alattab.site/api/v1
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prepare Pages metadata and prevent stale cache
        working-directory: client2
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          root = Path('build/web')
          sha = os.environ['BUILD_SHA']
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')

          # Works with both legacy main.dart.js and newer Flutter bootstrap builds.
          html = html.replace('flutter_bootstrap.js', 'flutter_bootstrap.js?v=' + sha)
          html = re.sub(
              r'(?<![A-Za-z0-9_./-])main\\.dart\\.js(?:\\?[^"\\'\\s)]*)?',
              'main.dart.js?v=' + sha,
              html,
          )
          for path in root.rglob('*.js'):
              js = path.read_text(encoding='utf-8')
              js = re.sub(
                  r'(?<![A-Za-z0-9_./-])main\\.dart\\.js(?:\\?[^"\\'\\s)]*)?',
                  'main.dart.js?v=' + sha,
                  js,
              )
              path.write_text(js, encoding='utf-8')

          guard = (
              '\\n<meta name="altakhfid-build" content="' + sha + '">' +
              '\\n<meta name="theme-color" content="#050505">' +
              '\\n<meta name="application-name" content="التخفيض الصح">' +
              '\\n<meta name="apple-mobile-web-app-title" content="التخفيض الصح">' +
              '\\n<link rel="icon" type="image/png" href="favicon.png">' +
              '\\n<link rel="apple-touch-icon" href="icons/Icon-192.png">\\n'
          )
          html = html.replace('</head>', guard + '</head>')
          index.write_text(html, encoding='utf-8')

          manifest = root / 'manifest.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['name'] = 'التخفيض الصح'
          data['short_name'] = 'التخفيض الصح'
          data['description'] = 'متجر التخفيض الصح'
          data['display'] = 'standalone'
          data['start_url'] = './'
          data['scope'] = './'
          data['theme_color'] = '#050505'
          data['background_color'] = '#050505'
          data['icons'] = [
              {'src': 'icons/Icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
              {'src': 'icons/Icon-512.png', 'sizes': '512x512', 'type': 'image/png'},
              {'src': 'icons/Icon-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
          ]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          # GitHub Pages custom-domain and route fallback.
          (root / '404.html').write_text(index.read_text(encoding='utf-8'), encoding='utf-8')
          (root / 'CNAME').write_text('takhfidsh.alattab.site\\n', encoding='utf-8')
          PY

      - name: Verify web output
        working-directory: client2
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/manifest.json
          test -s build/web/CNAME
          grep -q 'التخفيض الصح' build/web/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: altakhfid-client2-web-${{ github.sha }}
          path: client2/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client2/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy client2 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
