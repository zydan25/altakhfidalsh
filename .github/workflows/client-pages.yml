name: Customer Web - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'docs/CUSTOMER_SHEIN_PARITY.md'
      - '.github/workflows/client-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web runner
        working-directory: client
        run: flutter create --platforms=web .

      - name: Dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Flutter web
        working-directory: client
        env:
          API_BASE_URL: https://takhfidsh.alattab.site/api/v1
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prevent stale Flutter Web cache
        working-directory: client
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          
          root = Path('build/web')
          sha = os.environ['BUILD_SHA']
          
          # Bust the browser cache for both Flutter's bootstrap and the
          # generated main bundle. GitHub Pages serves immutable-looking
          # static assets for a while, so query-version the actual JS entry.
          index = root / 'index.html'
          s = index.read_text(encoding='utf-8')
          s = s.replace(
              'flutter_bootstrap.js',
              'flutter_bootstrap.js?v=' + sha
          )
          
          # Also version every direct main.dart.js reference that Flutter's
          # bootstrap emits. This is the part that prevents an old app bundle
          # from surviving after a successful Pages deployment.
          for p in root.rglob('*.js'):
              js = p.read_text(encoding='utf-8')
              js = re.sub(
                  r'(?<![A-Za-z0-9_./-])main\.dart\.js(?:\?[^"\'\s)]*)?',
                  'main.dart.js?v=' + sha,
                  js,
              )
              p.write_text(js, encoding='utf-8')
          
          guard = '''
          <meta name="altakhfid-build" content="BUILD_SHA_PLACEHOLDER">
          <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="Pragma" content="no-cache">
          <meta http-equiv="Expires" content="0">
          <script>
          (async function(){
            try {
              if ("serviceWorker" in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
              }
              if ("caches" in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              }
            } catch (_) {}
          })();
          </script>
          '''.replace('BUILD_SHA_PLACEHOLDER', sha)
          s = s.replace('</head>', guard + '\n</head>')
          index.write_text(s, encoding='utf-8')
          PY
      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: altakhfid-web-${{ github.sha }}
          path: client/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
