name: Customer Web - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'docs/CUSTOMER_SHEIN_PARITY.md'
      - '.github/workflows/client-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web runner
        working-directory: client
        run: flutter create --platforms=web .

      - name: Dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Flutter web
        working-directory: client
        env:
          API_BASE_URL: https://takhfidsh.alattab.site/api/v1
        run: |
          flutter build web --release \
            --pwa-strategy=none \
            --base-href "/${GITHUB_REPOSITORY#*/}/" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prevent stale Flutter Web cache
        working-directory: client
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('build/web/index.html')
          s = p.read_text(encoding='utf-8')
          sha = os.environ['BUILD_SHA']
          s = s.replace(
              '<script src="flutter_bootstrap.js" async></script>',
              '<script src="flutter_bootstrap.js?v=' + sha + '" async></script>'
          )
          guard = '''
          <meta name="altakhfid-build" content="BUILD_SHA_PLACEHOLDER">
          <script>
          (async function(){
            try {
              if ("serviceWorker" in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
              }
              if ("caches" in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              }
            } catch (_) {}
          })();
          </script>
          '''.replace('BUILD_SHA_PLACEHOLDER', sha)
          s = s.replace('</head>', guard + '\n</head>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
