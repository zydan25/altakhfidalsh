name: Customer Web - GitHub Pages (client2)

on:
  push:
    branches: [main]
    paths:
      - 'client2/**'
      - 'docs/CUSTOMER_SHEIN_PARITY.md'
      - '.github/workflows/client-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for legacy Flutter tooling
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Flutter 2.2.3 (first stable web-capable toolchain)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "2.2.3"
          channel: stable
          cache: true
          pub-cache: true

      - name: Prepare branding assets
        run: |
          mkdir -p client2/assets client2/web/icons
          cp 20260911_164630.jpg client2/assets/app_background.jpg
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert 20260911_164630.jpg -auto-orient -colorspace sRGB -fuzz 10% -trim +repage -resize '470x470^' -gravity center -background '#050505' -extent 470x470 -bordercolor '#050505' -border 21 -unsharp 0x0.8+0.8+0 -strip client2/web/icons/Icon-512.png
          convert client2/web/icons/Icon-512.png -resize 192x192 -strip client2/web/icons/Icon-192.png
          cp client2/web/icons/Icon-512.png client2/web/icons/Icon-maskable-512.png
          convert client2/web/icons/Icon-512.png -resize 64x64 -strip client2/web/favicon.png

      - name: Resolve dependencies
        working-directory: client2
        run: flutter pub get

      - name: Patch legacy media package APIs for Flutter 2.2
        working-directory: client2
        run: python tool/patch_legacy_packages.py
      - name: Configure base URL for GitHub Pages and custom domain
        working-directory: client2
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('web/index.html')
          html = path.read_text(encoding='utf-8')
          # The deployment currently lives at /altakhfidalsh/ on github.io.
          # If a custom domain is enabled later, its app path will be /.
          html = re.sub(r'<base\b[^>]*>', '', html, count=1, flags=re.IGNORECASE)
          bootstrap = """  <script data-client2-base>
            (function () {
              var host = window.location.hostname.toLowerCase();
              var baseHref = host === 'zydan25.github.io'
                ? '/altakhfidalsh/'
                : '/';
              document.write('<base href="' + baseHref + '">');
            })();
          </script>"""
          if 'data-client2-base' not in html:
              html = html.replace('<head>', '<head>' + chr(10) + bootstrap, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Build Flutter web from client2
        working-directory: client2
        env:
          API_BASE_URL: https://takhfidsh.alattab.site/api/v1
        run: |
          flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prepare Pages metadata and prevent stale cache
        working-directory: client2
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          root = Path('build/web')
          sha = os.environ['BUILD_SHA']
          index = root / 'index.html'
          html = index.read_text(encoding='utf-8')
          html = html.replace('flutter_bootstrap.js', 'flutter_bootstrap.js?v=' + sha)
          html = html.replace('main.dart.js', 'main.dart.js?v=' + sha)

          guard = chr(10).join([
              '<meta name="altakhfid-build" content="' + sha + '">',
              '<meta name="theme-color" content="#050505">',
              '<meta name="application-name" content="التخفيض الصح">',
              '<meta name="apple-mobile-web-app-title" content="التخفيض الصح">',
              '<link rel="icon" type="image/png" href="favicon.png">',
              '<link rel="apple-touch-icon" href="icons/Icon-192.png">',
          ])
          html = html.replace('</head>', guard + chr(10) + '</head>')
          index.write_text(html, encoding='utf-8')

          manifest = root / 'manifest.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['name'] = 'التخفيض الصح'
          data['short_name'] = 'التخفيض الصح'
          data['description'] = 'متجر التخفيض الصح'
          data['display'] = 'standalone'
          data['start_url'] = './'
          data['scope'] = './'
          data['theme_color'] = '#050505'
          data['background_color'] = '#050505'
          data['icons'] = [
              {'src': 'icons/Icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
              {'src': 'icons/Icon-512.png', 'sizes': '512x512', 'type': 'image/png'},
              {'src': 'icons/Icon-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
          ]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')
          (root / '404.html').write_text(index.read_text(encoding='utf-8'), encoding='utf-8')
          (root / 'CNAME').write_text('takhfidsh.alattab.site' + chr(10), encoding='utf-8')
          PY

      - name: Verify client2 web output
        working-directory: client2
        run: |
          test -s build/web/index.html
          test -s build/web/main.dart.js
          test -s build/web/manifest.json
          test -s build/web/CNAME
          grep -q 'التخفيض الصح' build/web/index.html
          grep -q 'data-client2-base' build/web/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: altakhfid-client2-web-${{ github.sha }}
          path: client2/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client2/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Deploy client2 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
