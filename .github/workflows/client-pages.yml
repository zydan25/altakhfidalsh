name: Customer Web - GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - 'docs/CUSTOMER_SHEIN_PARITY.md'
      - '.github/workflows/client-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web runner
        working-directory: client
        run: flutter create --platforms=web .

      - name: Prepare branding assets
        run: |
          mkdir -p client/assets client/web/icons
          cp 20260911_164630.jpg client/assets/app_background.jpg

          # Generate the same branded launcher artwork used by the Android APK.
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert 20260911_164630.jpg             -auto-orient             -colorspace sRGB             -fuzz 10% -trim +repage             -resize '470x470^'             -gravity center             -background '#050505'             -extent 470x470             -bordercolor '#050505' -border 21             -unsharp 0x0.8+0.8+0             -strip             client/web/icons/Icon-512.png
          convert client/web/icons/Icon-512.png -resize 192x192 -strip client/web/icons/Icon-192.png
          cp client/web/icons/Icon-512.png client/web/icons/Icon-maskable-512.png
          convert client/web/icons/Icon-512.png -resize 64x64 -strip client/web/favicon.png

      - name: Dependencies
        working-directory: client
        run: flutter pub get

      - name: Build Flutter web
        working-directory: client
        env:
          API_BASE_URL: https://takhfidsh.alattab.site/api/v1
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Prevent stale Flutter Web cache
        working-directory: client
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          
          root = Path('build/web')
          sha = os.environ['BUILD_SHA']
          
          # Bust the browser cache for both Flutter's bootstrap and the
          # generated main bundle. GitHub Pages serves immutable-looking
          # static assets for a while, so query-version the actual JS entry.
          index = root / 'index.html'
          s = index.read_text(encoding='utf-8')
          s = s.replace(
              'flutter_bootstrap.js',
              'flutter_bootstrap.js?v=' + sha
          )
          
          # Also version every direct main.dart.js reference that Flutter's
          # bootstrap emits. This is the part that prevents an old app bundle
          # from surviving after a successful Pages deployment.
          for p in root.rglob('*.js'):
              js = p.read_text(encoding='utf-8')
              js = re.sub(
                  r'(?<![A-Za-z0-9_./-])main\.dart\.js(?:\?[^"\'\s)]*)?',
                  'main.dart.js?v=' + sha,
                  js,
              )
              p.write_text(js, encoding='utf-8')
          
          guard = '''
          <meta name="altakhfid-build" content="BUILD_SHA_PLACEHOLDER">
          <meta name="theme-color" content="#050505">
          <meta name="application-name" content="التخفيض الصح">
          <meta name="apple-mobile-web-app-title" content="التخفيض الصح">
          <link rel="icon" type="image/png" href="favicon.png">
          <link rel="apple-touch-icon" href="icons/Icon-192.png">
          '''.replace('BUILD_SHA_PLACEHOLDER', sha)
          s = s.replace('</head>', guard + '\n</head>')
          index.write_text(s, encoding='utf-8')

          import json
          manifest = root / 'manifest.json'
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['name'] = 'التخفيض الصح'
          data['short_name'] = 'التخفيض الصح'
          data['description'] = 'متجر التخفيض الصح'
          data['display'] = 'standalone'
          data['start_url'] = './'
          data['scope'] = './'
          data['theme_color'] = '#050505'
          data['background_color'] = '#050505'
          data['icons'] = [
              {'src': 'icons/Icon-192.png', 'sizes': '192x192', 'type': 'image/png'},
              {'src': 'icons/Icon-512.png', 'sizes': '512x512', 'type': 'image/png'},
              {'src': 'icons/Icon-maskable-512.png', 'sizes': '512x512', 'type': 'image/png', 'purpose': 'maskable'},
          ]
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')

          # A real HTML fallback makes direct Pages routes and invitation
          # links recover to the Flutter shell instead of a blank/404 page.
          (root / '404.html').write_text(index.read_text(encoding='utf-8'), encoding='utf-8')
          (root / 'CNAME').write_text('takhfidsh.alattab.site\n', encoding='utf-8')
          PY
      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: altakhfid-web-${{ github.sha }}
          path: client/build/web
          if-no-files-found: error
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
