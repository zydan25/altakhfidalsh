<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>دخول الإدارة · التخفيض</title>
  <link rel="stylesheet" href="{{ url_for('admin.static', filename='admin.css') }}">
</head>
<body>
  <main class="login-page">
    <section class="login-card panel">
      <div class="brand-mark">ت</div>
      <span class="eyebrow">لوحة الإدارة</span>
      <h1>تسجيل دخول المدير</h1>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <form method="post" class="form-stack">
        <label>اسم المستخدم<input name="username" autocomplete="username" required></label>
        <label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label>
        <input type="hidden" name="next" value="{{ next_path }}">
        <button class="primary-button" type="submit">دخول</button>
      </form>
    </section>
  </main>
</body>
</html>
