{% extends "admin/base.html" %}{% block content %}
<section class="module-header"><span class="eyebrow">الترندات</span><h2>الهاشتاجات</h2></section>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}{% if success %}<div class="alert success">{{ success }}</div>{% endif %}
<section class="two-panel"><article class="panel"><form method="post" class="form-stack"><label>الاسم<input name="name" required></label><label>Slug<input name="slug" required dir="ltr"></label><label>الاسم الظاهر<input name="display_name"></label><button class="primary-button">إضافة وسم</button></form></article><article class="panel"><div class="stack-list">{% for x in hashtags %}<div class="stack-row"><strong>{{ x.display_name or x.name }}</strong><span>#{{ x.slug }}</span></div>{% else %}<div class="empty-state compact"><div class="empty-icon">#</div><strong>لا توجد وسوم</strong></div>{% endfor %}</div></article></section>
{% endblock %}
